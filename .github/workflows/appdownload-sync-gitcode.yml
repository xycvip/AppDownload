name: 发布同步到 GitCode

# 放在 xycvip/AppDownload 仓库的 .github/workflows/ 下。
# AppDownload 收到新的 redguo- 发布后，自动把同一份安装包转发到 GitCode。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag（留空取最新的 redguo 发布）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitcode-${{ github.event.release.tag_name || inputs.tag || 'latest' }}
  cancel-in-progress: false

env:
  GITCODE_OWNER: xycvip
  GITCODE_REPO: redguo
  TAG_PREFIX: redguo-

jobs:
  sync:
    name: 转发到 GitCode
    # 只同步红果剧场的发布，hongguotv 等其他软件不处理
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.release.tag_name || '', 'redguo-')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 确定要同步的版本
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          tag="${EVENT_TAG:-${INPUT_TAG:-}}"

          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
              --jq '.[].tagName' | grep -E "^${TAG_PREFIX}v" | sort -V | tail -n1 || true)
          fi

          if [ -z "$tag" ]; then
            echo "::error::找不到 ${TAG_PREFIX} 开头的发布"
            exit 1
          fi

          case "$tag" in
            "${TAG_PREFIX}"*) ;;
            *) echo "::error::tag ${tag} 不属于 ${TAG_PREFIX}，拒绝同步"; exit 1 ;;
          esac

          echo "准备同步：${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: 下载发布资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          ls -lh dist

      - name: 上传到 GitCode
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::error::本仓库未配置 GITCODE_TOKEN，无法同步"
            exit 1
          fi

          api="https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}"

          # 说明正文直接复用 GitHub 这一版的正文
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md || echo "" > notes.md
          title=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json name --jq .name)

          # 创建 Release（已存在就沿用）
          if curl -fsS "${api}/releases/tags/${TAG}?access_token=${TOKEN}" >/dev/null 2>&1; then
            echo "GitCode 已存在 ${TAG}，直接上传附件"
          else
            jq -n --arg tag "$TAG" --arg name "${title:-$TAG}" --rawfile body notes.md \
              '{tag_name:$tag, name:$name, body:$body}' > payload.json
            curl -fsS -X POST "${api}/releases?access_token=${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @payload.json >/dev/null
            echo "GitCode Release 已创建：${TAG}"
          fi

          # 逐个上传：先取预签名地址，再 PUT
          for f in dist/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            encoded=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$fname")
            info=$(curl -fsS "${api}/releases/${TAG}/upload_url?access_token=${TOKEN}&file_name=${encoded}")

            url=$(printf '%s' "$info" | jq -r '.url')
            [ -n "$url" ] && [ "$url" != "null" ] || { echo "::error::${fname} 未获取到上传地址"; exit 1; }

            args=()
            while IFS= read -r line; do args+=(-H "$line"); done < <(
              printf '%s' "$info" | jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"'
            )
            curl -fsS -X PUT "${args[@]}" --upload-file "$f" "$url" >/dev/null
            echo "已上传：${fname}"
          done

          echo "同步完成：https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases"
