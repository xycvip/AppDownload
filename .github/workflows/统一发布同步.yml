name: 红果应用统一发布同步

# 统一监听 AppDownload 的 Release 发布事件：
# - hongguotv-v*：只执行红果TV同步任务
# - redguo-*：只执行红果剧场同步任务
# 手动运行可选择目标应用；tag 留空时分别自动选择对应应用的最新正式版。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: '选择要同步的应用'
        required: true
        type: choice
        default: hongguotv
        options:
          - hongguotv
          - redguo
          - all
      tag:
        description: '目标 Release tag（留空自动选择所选应用的最新正式版）'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: appdownload-release-sync-${{ github.event.release.tag_name || format('{0}-{1}', inputs.target || 'hongguotv', inputs.tag || 'latest') }}
  cancel-in-progress: false

jobs:
  sync-redguo:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'redguo-')) || (github.event_name == 'workflow_dispatch' && (inputs.target == 'redguo' || inputs.target == 'all')) }}
    name: 同步发布与文档
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GITCODE_OWNER: xycvip
      GITCODE_REPO: redguo
      TAG_PREFIX: redguo-
      PACKAGE_NAME: com.x.redguoapp
      APP_NAME: 红果剧场

    steps:
      - name: 确定要同步的版本
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail

          tag="${INPUT_TAG:-}"

          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
              --jq '.[].tagName' | grep -E "^${TAG_PREFIX}v" | sort -V | tail -n1 || true)
          fi

          if [ -z "$tag" ]; then
            echo "::error::找不到 ${TAG_PREFIX} 开头的发布"
            exit 1
          fi

          case "$tag" in
            "${TAG_PREFIX}"*) ;;
            *) echo "::error::tag ${tag} 不属于 ${TAG_PREFIX}，拒绝同步"; exit 1 ;;
          esac

          body="${tag#${TAG_PREFIX}v}"
          name="${body%%-*}"
          code="${body##*-}"

          if ! printf '%s' "$name" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${tag} 里的版本名不合法：${name}"
            exit 1
          fi
          if ! printf '%s' "$code" | grep -qE '^[0-9]{10}$'; then
            echo "::error::tag ${tag} 里的内部版本号不合法：${code}"
            exit 1
          fi

          info=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}")
          released=$(printf '%s' "$info" | jq -r '.published_at // .created_at // empty')
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md

          # 从发布正文里取更新说明与源码提交
          python3 - <<'PY' > ip.txt
          import re, pathlib
          body = pathlib.Path('body.md').read_text(encoding='utf-8')
          m = re.search(r'<!-- NOTES_START -->(.*?)<!-- NOTES_END -->', body, re.S)
          notes = (m.group(1).strip() if m else '')
          c = re.search(r'<!-- SRC_COMMIT ([0-9a-f]{7,40}) -->', body)
          print(c.group(1) if c else '')
          pathlib.Path('notes.txt').write_text(notes + '\n', encoding='utf-8')
          PY
          commit=$(head -n1 ip.txt)

          echo "版本名：${name}  内部版本：${code}"
          echo "源码提交：${commit:-未记录}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          echo "released=${released}" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: 下载发布资产
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ steps.meta.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir dist --clobber
          ls -lh dist

      - name: 生成清单与文档片段
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          CODE: ${{ steps.meta.outputs.code }}
          RELEASED: ${{ steps.meta.outputs.released }}
          SRC_COMMIT: ${{ steps.meta.outputs.commit }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p out

          cat > gen.py <<'PY'
          import hashlib, json, os, pathlib

          env = os.environ
          tag, name, code = env['TAG'], env['NAME'], env['CODE']
          repo, pkg = env['GH_REPO'], env['PACKAGE_NAME']
          released, commit = env.get('RELEASED', ''), env.get('SRC_COMMIT', '')
          notes = pathlib.Path('notes.txt').read_text(encoding='utf-8').strip()
          if not notes:
              notes = '本次发布未填写更新说明。'

          def build(abi):
              fn = 'RedGuo-%s-%s.apk' % (name, abi)
              p = pathlib.Path('dist') / fn
              if not p.exists():
                  raise SystemExit('缺少产物 %s' % fn)
              return {
                  'abi': abi,
                  'name': fn,
                  'size': p.stat().st_size,
                  'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
                  'url': 'https://github.com/%s/releases/download/%s/%s' % (repo, tag, fn),
              }

          a32, a64 = build('v7a'), build('v8a')

          # 清单由构建工作流生成并挂在 Release 上，这里原样复制，保证两边字节一致。
          manifest_path = pathlib.Path('dist/update.json')
          if manifest_path.exists():
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          else:
              print('::warning::发布里没有 update.json，按发布信息补一份')
              manifest = {
                  'schema': 1,
                  'packageName': pkg,
                  'version': '%s+%s' % (name, code),
                  'versionCode': int(code),
                  'versionName': name,
                  'tag': tag,
                  'apks': [
                      {'abi': a['abi'], 'name': a['name'], 'size': a['size'],
                       'sha256': a['sha256'], 'url': a['url'],
                       'mirrors': ['https://gitcode.com/%s/%s/releases/download/%s/%s' % (
                           env['GITCODE_OWNER'], env['GITCODE_REPO'], tag, a['name'])]}
                      for a in (a32, a64)
                  ],
              }
          if commit and not manifest.get('sourceCommit'):
              manifest['sourceCommit'] = commit
          if released and not manifest.get('releasedAt'):
              manifest['releasedAt'] = released
          notes = (manifest.get('notes') or notes).strip()

          payload = json.dumps(manifest, ensure_ascii=False, indent=2) + '\n'
          pathlib.Path('out/update.json').write_text(payload, encoding='utf-8')
          raw_latest = 'https://raw.githubusercontent.com/%s/main/redguo/update.json' % repo
          # GitCode 的仓库文件走 CloudWAF，raw 地址会 418，这里只链发布页。
          page_gitcode = 'https://gitcode.com/%s/%s/releases/tag/%s' % (
              env['GITCODE_OWNER'], env['GITCODE_REPO'], tag)
          tree = 'https://github.com/%s/tree/main/redguo' % repo

          block = '''<!-- LATEST_RELEASE_START -->
          当前版本：**{name}**（内部版本 `{code}`）

          - 32 位安装包：[{f32}]({u32})（armeabi-v7a）
          - 64 位安装包：[{f64}]({u64})（arm64-v8a）
          - 完整性校验：[SHA256SUMS]({usum})
          - 应用内更新清单：[update.json]({ulatest})（[GitCode 发布页]({ugitcode})）
          - 完整发布页：[{tag}]({utag})

          ## 本次更新说明

          {notes}
          <!-- LATEST_RELEASE_END -->'''.format(
              name=name, code=code,
              f32=a32['name'], u32=a32['url'],
              f64=a64['name'], u64=a64['url'],
              usum='https://github.com/%s/releases/download/%s/SHA256SUMS' % (repo, tag),
              ulatest=raw_latest, ugitcode=page_gitcode, tag=tag,
              utag='https://github.com/%s/releases/tag/%s' % (repo, tag),
              notes=notes)

          app = '''<!-- BEGIN APP: redguo -->
          ### 红果剧场

          当前版本：**{name}**（内部版本 `{code}`）

          - [下载 32 位安装包 {f32}]({u32})
          - [下载 64 位安装包 {f64}]({u64})
          - [应用内更新清单 update.json]({ulatest})
          - [红果剧场全部下载文件与说明]({tree})

          **本次更新说明**

          {notes}
          <!-- END APP: redguo -->'''.format(
              name=name, code=code, f32=a32['name'], u32=a32['url'],
              f64=a64['name'], u64=a64['url'], ulatest=raw_latest, tree=tree, notes=notes)

          pathlib.Path('out/latest_block.md').write_text(block + '\n', encoding='utf-8')
          pathlib.Path('out/app_block.md').write_text(app + '\n', encoding='utf-8')
          print('update.json / 区块 生成完成')
          PY

          python3 gen.py
          cat out/update.json

      - name: 更新 AppDownload 仓库文件
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.meta.outputs.name }}
          CODE: ${{ steps.meta.outputs.code }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          cat > merge.py <<'PY'
          import os, re, sys

          block_path, old_path, out_path = sys.argv[1], sys.argv[2], sys.argv[3]
          block = open(block_path, encoding='utf-8').read().strip()
          old = open(old_path, encoding='utf-8').read() if os.path.exists(old_path) else ''

          def historical(inner):
              inner = inner.replace('当前版本：', '发布版本：')
              inner = inner.replace('## 本次更新说明', '**本次更新说明**')
              m = re.search(r'发布版本：\*\*([^*]+)\*\*', inner)
              ver = m.group(1) if m else '未知版本'
              return '### 红果剧场正式版 %s\n\n%s\n' % (ver, inner.strip())

          if not old.strip():
              doc = ('# 红果剧场 发布页\n\n'
                     '红果剧场（RedGuo）Android 客户端安装包与应用内更新清单。'
                     '包名 `%s`，同时提供 32 位（armeabi-v7a）与 64 位（arm64-v8a）两个安装包。\n\n'
                     % os.environ['PACKAGE_NAME'])
              doc += block + '\n\n## 历史版本\n'
              open(out_path, 'w', encoding='utf-8').write(doc)
              sys.exit(0)

          m = re.search(r'<!-- LATEST_RELEASE_START -->(.*?)<!-- LATEST_RELEASE_END -->', old, re.S)
          if not m:
              doc = old.rstrip() + '\n\n' + block + '\n\n## 历史版本\n'
              open(out_path, 'w', encoding='utf-8').write(doc)
              sys.exit(0)

          entry = historical(m.group(1).strip())
          doc = old[:m.start()] + block + old[m.end():]

          if '## 历史版本' in doc:
              i = doc.index('## 历史版本') + len('## 历史版本')
              tail = doc[i:].lstrip('\n')
              doc = doc[:i] + '\n\n' + entry + '\n' + tail
          else:
              doc = doc.rstrip() + '\n\n## 历史版本\n\n' + entry

          open(out_path, 'w', encoding='utf-8').write(doc)
          PY

          put() {
            path="$1"; file="$2"; msg="$3"
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}" --jq .sha 2>/dev/null || true)
            args=(-X PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message="$msg" -f branch=main)
            if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
            gh api "${args[@]}" -f content="$(base64 -w0 "$file")" >/dev/null
            echo "已写入 ${path}"
          }

          # 1) 根 README 的 redguo 区块
          gh api "repos/${GITHUB_REPOSITORY}/contents/README.md" --jq .content | base64 -d > old_root.md
          python3 - <<'PY'
          import re
          old = open('old_root.md', encoding='utf-8').read()
          block = open('out/app_block.md', encoding='utf-8').read().strip()

          m = re.search(r'<!-- BEGIN APP: redguo -->.*?<!-- END APP: redguo -->', old, re.S)
          if m:
              new = old[:m.start()] + block + old[m.end():]
          else:
              anchor = '<!-- END APP: hongguoTV -->'
              if anchor in old:
                  i = old.index(anchor) + len(anchor)
                  new = old[:i] + '\n\n' + block + old[i:]
              elif '## 最新版本' in old:
                  i = old.index('## 最新版本') + len('## 最新版本')
                  new = old[:i] + '\n\n' + block + old[i:]
              else:
                  new = old.rstrip() + '\n\n' + block + '\n'

          if not re.search(r'^- `redguo/`', new, re.M):
              line = '- `hongguoTV/`'
              idx = new.find(line)
              if idx >= 0:
                  eol = new.index('\n', idx)
                  new = (new[:eol + 1]
                         + '- `redguo/`：红果剧场（RedGuo）Android APK 发布文件与应用内更新清单。\n'
                         + new[eol + 1:])
          open('out/root_readme.md', 'w', encoding='utf-8').write(new)
          PY
          put README.md out/root_readme.md "${APP_NAME} ${NAME}（${CODE}）：更新下载信息"

          # 2) redguo/update.json（应用内更新唯一清单）
          put redguo/update.json out/update.json "${APP_NAME} ${NAME}：更新清单"

          # 3) redguo/README.md（更新文档，保留历史）
          if gh api "repos/${GITHUB_REPOSITORY}/contents/redguo/README.md" --jq .content > /dev/null 2>&1; then
            gh api "repos/${GITHUB_REPOSITORY}/contents/redguo/README.md" --jq .content | base64 -d > old_doc.md
          else
            : > old_doc.md
          fi
          python3 merge.py out/latest_block.md old_doc.md out/redguo_readme.md
          put redguo/README.md out/redguo_readme.md "${APP_NAME} ${NAME}：更新说明"

      - name: 上传到 GitCode Release
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          NAME: ${{ steps.meta.outputs.name }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::本仓库未配置 GITCODE_TOKEN，跳过 GitCode 同步"
            exit 0
          fi

          api="https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}"
          title="红果剧场正式版 ${NAME}"

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md

          if curl -fsS "${api}/releases/tags/${TAG}?access_token=${TOKEN}" >/dev/null 2>&1; then
            echo "GitCode 已存在 ${TAG}，直接上传附件"
          else
            jq -n --arg tag "$TAG" --arg name "$title" --rawfile body notes.md \
              '{tag_name:$tag, name:$name, body:$body}' > payload.json
            curl -fsS -X POST "${api}/releases?access_token=${TOKEN}" \
              -H 'Content-Type: application/json' \
              --data-binary @payload.json >/dev/null
            echo "GitCode Release 已创建：${TAG}（${title}）"
          fi

          for f in dist/*; do
            [ -f "$f" ] || continue
            fname=$(basename "$f")
            encoded=$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$fname")
            info=$(curl -fsS "${api}/releases/${TAG}/upload_url?access_token=${TOKEN}&file_name=${encoded}")

            url=$(printf '%s' "$info" | jq -r '.url')
            [ -n "$url" ] && [ "$url" != "null" ] || { echo "::error::${fname} 未获取到上传地址"; exit 1; }

            args=()
            while IFS= read -r line; do args+=(-H "$line"); done < <(
              printf '%s' "$info" | jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"'
            )
            curl -fsS -X PUT "${args[@]}" --upload-file "$f" "$url" >/dev/null
            echo "已上传：${fname}"
          done

      - name: 写入 GitCode 仓库文件
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          NAME: ${{ steps.meta.outputs.name }}
          CODE: ${{ steps.meta.outputs.code }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::本仓库未配置 GITCODE_TOKEN，跳过 GitCode 仓库文件写入"
            exit 0
          fi

          api="https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}"
          fail=0

          # 读现有 README（可能为空仓库）
          # 只有 404 才表示 README 尚不存在；其他异常必须中止，避免覆盖历史文档。
          if ! code=$(curl --silent --show-error --connect-timeout 20 --max-time 60 \
            -o gc_readme.json -w '%{http_code}' \
            "${api}/contents/README.md?access_token=${TOKEN}"); then
            echo "::error::读取 GitCode README 失败：curl 网络请求异常"
            exit 1
          fi

          case "$code" in
            200)
              python3 - <<'PY'
          import base64, json, pathlib
          data = json.loads(pathlib.Path('gc_readme.json').read_text(encoding='utf-8'))
          content = data.get('content')
          if not isinstance(content, str) or not content:
              raise SystemExit('GitCode README 响应缺少有效 content，拒绝覆盖')
          try:
              decoded = base64.b64decode(content, validate=True).decode('utf-8')
          except Exception as exc:
              raise SystemExit(f'GitCode README 解码失败，拒绝覆盖：{exc}')
          pathlib.Path('old_doc.md').write_text(decoded, encoding='utf-8')
          PY
              ;;
            404)
              echo "GitCode README 不存在，按首次创建处理"
              : > old_doc.md
              ;;
            *)
              echo "::error::读取 GitCode README 失败（HTTP ${code}），拒绝覆盖历史文档"
              head -c 500 gc_readme.json || true
              exit 1
              ;;
          esac

          python3 merge.py out/latest_block.md old_doc.md out/gc_readme.md

          write_file() {
            path="$1"; file="$2"; msg="$3"
            content=$(base64 -w0 "$file")
            sha=$(curl -s "${api}/contents/${path}?access_token=${TOKEN}" \
              | jq -r '.sha // empty' 2>/dev/null || true)

            jq -n --arg m "$msg" --arg c "$content" --arg b main --arg s "$sha" \
              'if $s == "" then {message:$m, content:$c, branch:$b}
               else {message:$m, content:$c, branch:$b, sha:$s} end' > gc.json

            http=$(curl -s -o gc_resp.json -w '%{http_code}' -X PUT \
              "${api}/contents/${path}?access_token=${TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @gc.json)

            if [ "$http" != "200" ] && [ "$http" != "201" ]; then
              # 部分环境创建走 POST，回退一次
              http=$(curl -s -o gc_resp.json -w '%{http_code}' -X POST \
                "${api}/contents/${path}?access_token=${TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @gc.json)
            fi

            if [ "$http" = "200" ] || [ "$http" = "201" ]; then
              echo "GitCode 已写入 ${path}"
            else
              echo "::warning::GitCode 写入 ${path} 失败（HTTP ${http}）：$(head -c 300 gc_resp.json)"
              fail=1
            fi
          }

          write_file update.json out/update.json "红果剧场 ${NAME}：更新清单"
          write_file README.md out/gc_readme.md "红果剧场 ${NAME}：更新说明"

          exit "$fail"

      - name: 输出摘要
        if: always()
        env:
          NAME: ${{ steps.meta.outputs.name }}
          CODE: ${{ steps.meta.outputs.code }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          {
            echo "## 发布同步结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本名 | ${NAME} |"
            echo "| 内部版本号 | ${CODE} |"
            echo "| tag | ${TAG} |"
            echo "| GitHub 发布页 | https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG} |"
            echo "| 更新清单 | https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/redguo/update.json |"
            echo "| 更新文档 | https://github.com/${GITHUB_REPOSITORY}/blob/main/redguo/README.md |"
            echo "| GitCode 发布页 | https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases/tag/${TAG} |"
          } >> "$GITHUB_STEP_SUMMARY"

  sync-hongguotv:
    if: ${{ (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'hongguotv-v')) || (github.event_name == 'workflow_dispatch' && (inputs.target == 'hongguotv' || inputs.target == 'all')) }}
    name: 同步红果TV正式版到 GitCode
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITCODE_OWNER: xycvip
      GITCODE_REPO: hongguotv

    steps:
      - name: 校验版本并下载 GitHub Release 附件
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            echo "未填写 tag，自动查找最新的红果TV正式版 Release"
            TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("hongguotv-v")))] | sort_by(.publishedAt) | last | .tagName // empty')"
            if [ -z "$TAG" ]; then
              echo "::error::没有找到可同步的红果TV正式版 Release"
              exit 1
            fi
            echo "自动选择最新正式版：$TAG"
          fi
          export TAG
          case "$TAG" in
            hongguotv-v*) ;;
            *) echo "::error::只允许同步 hongguotv-v 开头的正式版 tag：$TAG"; exit 1 ;;
          esac

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,assets,name,body > release.json
          jq -e '.isDraft == false and .isPrerelease == false' release.json >/dev/null || {
            echo "::error::目标 Release 是草稿或预发布版本，拒绝同步"
            exit 1
          }

          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --clobber

          test -s dist/update.json
          test -s dist/latest.json
          cmp -s dist/update.json dist/latest.json || {
            echo "::error::Release 中的 latest.json 与 update.json 内容不一致"
            exit 1
          }
          test -s dist/SHA256SUMS
          python3 - <<'PY'
          import json, os, pathlib, re
          tag = os.environ["TAG"]
          data = json.loads(pathlib.Path("dist/update.json").read_text(encoding="utf-8"))
          if data.get("schema") != 1 or data.get("packageName") != "com.x.hongguotv":
              raise SystemExit("update.json 包名或 schema 不匹配")
          if data.get("tag") != tag:
              raise SystemExit("update.json 的 tag 与目标 Release 不一致")
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", str(data.get("versionName", ""))):
              raise SystemExit("update.json versionName 格式错误")
          apk = data.get("apk") or {}
          name = apk.get("name", "")
          if name != f'HongguoTV-{data["versionName"]}.apk':
              raise SystemExit("APK 文件名与版本号不匹配")
          if not re.fullmatch(r"[0-9a-fA-F]{64}", str(apk.get("sha256", ""))):
              raise SystemExit("APK SHA-256 格式错误")
          if not isinstance(apk.get("size"), int) or apk["size"] <= 0:
              raise SystemExit("APK 文件大小无效")
          if not pathlib.Path("dist", name).is_file():
              raise SystemExit(f"Release 缺少 APK：{name}")
          if pathlib.Path("dist", name).stat().st_size != apk["size"]:
              raise SystemExit("APK 实际大小与 update.json 不一致")
          pathlib.Path("meta.env").write_text(
              f'VERSION_NAME={data["versionName"]}\nAPK_NAME={name}\n', encoding="utf-8")
          PY
          source meta.env
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "已通过正式版清单与 APK 基础校验：$TAG"

      - name: 校验 APK SHA-256 并生成 GitCode 更新清单
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          APK_NAME="${{ steps.meta.outputs.apk_name }}"
          EXPECTED="$(jq -r '.apk.sha256' dist/update.json | tr 'A-F' 'a-f')"
          ACTUAL="$(sha256sum "dist/$APK_NAME" | awk '{print $1}')"
          [ "$EXPECTED" = "$ACTUAL" ] || {
            echo "::error::APK SHA-256 校验失败"
            exit 1
          }

          # GitCode 版本清单必须指向 GitCode Release 附件，不能继续指向 GitHub。
          GITCODE_APK_URL="https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/releases/download/${TAG}/${APK_NAME}"
          jq --arg url "$GITCODE_APK_URL" '.apk.url = $url' dist/update.json > dist/update-gitcode.json
          jq --arg url "$GITCODE_APK_URL" '.apk.url = $url' dist/latest.json > dist/latest-gitcode.json
          mv dist/update-gitcode.json dist/update.json
          mv dist/latest-gitcode.json dist/latest.json
          echo "APK SHA-256 校验通过，update.json 与 latest.json 均已切换为 GitCode 下载地址"

      - name: 创建或复用 GitCode Release
        id: gitcode_release
        env:
          GH_TOKEN: ${{ github.token }}
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::未配置 AppDownload 仓库密钥 GITCODE_TOKEN"
            exit 1
          fi

          API="https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}"
          TITLE="红果TV正式版 ${VERSION_NAME}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > release-notes.md

          # 只有 GitHub 上最新的正式版才标记为 GitCode latest，防止手动补同步旧版本时覆盖最新通道。
          LATEST_TAG="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select(.isDraft == false and .isPrerelease == false and (.tagName | startswith("hongguotv-v")))] | sort_by(.publishedAt) | last | .tagName // empty')"
          [ -n "$LATEST_TAG" ] || { echo "::error::无法确定 GitHub 最新正式版 tag"; exit 1; }
          IS_LATEST=false
          if [ "$TAG" = "$LATEST_TAG" ]; then
            IS_LATEST=true
          fi
          echo "is_latest=$IS_LATEST" >> "$GITHUB_OUTPUT"
          echo "GitHub 最新正式版：$LATEST_TAG；本次目标是否为最新：$IS_LATEST"

          if curl -fsS "${API}/releases/tags/${TAG}?access_token=${TOKEN}" -o gitcode-release.json; then
            echo "GitCode 已存在 Release：$TAG"
            if [ "$IS_LATEST" = "true" ]; then
              # 已存在的 Release 也必须显式升级为 latest，不能只在创建时设置。
              jq -n --arg name "$TITLE" --rawfile body release-notes.md \
                '{name:$name, body:$body, release_status:"latest"}' > payload.json
              curl -fsS -X PATCH "${API}/releases/${TAG}?access_token=${TOKEN}" \
                -H 'Content-Type: application/json' --data-binary @payload.json -o gitcode-release.json
              echo "已将现有 GitCode Release 状态更新为 latest"
            fi
          else
            if [ "$IS_LATEST" = "true" ]; then
              jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body release-notes.md \
                '{tag_name:$tag, name:$name, body:$body, release_status:"latest"}' > payload.json
            else
              jq -n --arg tag "$TAG" --arg name "$TITLE" --rawfile body release-notes.md \
                '{tag_name:$tag, name:$name, body:$body}' > payload.json
            fi
            curl -fsS -X POST "${API}/releases?access_token=${TOKEN}" \
              -H 'Content-Type: application/json' --data-binary @payload.json -o gitcode-release.json
            echo "已创建 GitCode Release：$TAG"
          fi

          # 对已存在的同名附件跳过上传，避免手动重跑时重复添加。
          for f in "dist/${{ steps.meta.outputs.apk_name }}" dist/SHA256SUMS dist/update.json dist/latest.json; do
            [ -s "$f" ] || { echo "::error::缺少待上传文件：$f"; exit 1; }
            fname="$(basename "$f")"
            if jq -e --arg n "$fname" '(.assets // []) | any(.name == $n)' gitcode-release.json >/dev/null 2>&1; then
              echo "GitCode 附件已存在，跳过：$fname"
              continue
            fi

            encoded="$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$fname")"
            info="$(curl -fsS "${API}/releases/${TAG}/upload_url?access_token=${TOKEN}&file_name=${encoded}")"
            url="$(printf '%s' "$info" | jq -r '.url // empty')"
            [ -n "$url" ] || { echo "::error::未获取到附件上传地址：$fname"; exit 1; }

            args=()
            while IFS= read -r line; do args+=(-H "$line"); done < <(
              printf '%s' "$info" | jq -r '.headers // {} | to_entries[] | "\(.key): \(.value)"'
            )
            curl -fsS -X PUT "${args[@]}" --upload-file "$f" "$url" >/dev/null
            echo "已上传 GitCode 附件：$fname"
          done

      - name: 最终核对 GitCode Release 附件
        env:
          TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          IS_LATEST: ${{ steps.gitcode_release.outputs.is_latest }}
        run: |
          set -euo pipefail
          API="https://api.gitcode.com/api/v5/repos/${GITCODE_OWNER}/${GITCODE_REPO}"
          curl -fsS "${API}/releases/tags/${TAG}?access_token=${TOKEN}" -o gitcode-release-final.json
          jq -e --arg apk "${{ steps.meta.outputs.apk_name }}" --argjson must_be_latest "$IS_LATEST" '
            (.assets // []) as $assets
            | ([$assets[].name] | index($apk) != null)
              and ([$assets[].name] | index("SHA256SUMS") != null)
              and ([$assets[].name] | index("update.json") != null)
              and ([$assets[].name] | index("latest.json") != null)
              and (if $must_be_latest then .release_status == "latest" else true end)
          ' gitcode-release-final.json >/dev/null || {
            echo "::error::GitCode Release 附件不完整，或最新正式版 release_status 未成功设置为 latest"
            cat gitcode-release-final.json
            exit 1
          }
          if [ "$IS_LATEST" = "true" ]; then
            echo "GitCode 最新正式版状态核对通过：release_status=latest"
          else
            echo "本次补同步的不是最新正式版，不覆盖 GitCode latest 状态"
          fi
          echo "GitCode Release 附件核对通过：APK、SHA256SUMS、update.json、latest.json"

      - name: 输出同步结果
        if: success()
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          {
            echo "## 红果TV GitCode 同步成功"
            echo ""
            echo "- 版本：${VERSION_NAME}"
            echo "- Tag：${TAG}"
            echo "- GitHub Release：https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
            echo "- GitCode Release：https://gitcode.com/${GITCODE_OWNER}/${GITCODE_REPO}/-/releases/${TAG}"
            echo "- 已同步：APK、SHA256SUMS、update.json、latest.json"
            echo "- GitCode update.json 中的 APK 地址已切换为 GitCode Release 下载地址"
          } >> "$GITHUB_STEP_SUMMARY"
